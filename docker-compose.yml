services:
  db:
    image: postgres:16
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  model:
    image: ollama/ollama:latest
    env_file: ./.env
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - ollama:/root/.ollama
      - ./models:/models  # Mount local models directory

  model-fetch:
    image: curlimages/curl:8.10.1
    env_file: ./.env
    environment:
      MODEL_URL: ${MODEL_URL}
      MODEL_FILE: ${MODEL_FILE}
    volumes:
      - ./models:/models
    command: >
      sh -ec '
        echo "MODEL_URL=$${MODEL_URL:?MODEL_URL is required}";
        : "$${MODEL_FILE:?MODEL_FILE is required}";
        echo "MODEL_FILE=$${MODEL_FILE}";
        mkdir -p "$$(dirname "$$MODEL_FILE")";
        if [ ! -s "$$MODEL_FILE" ]; then
          echo "Downloading...";
          curl -fSL --retry 5 --retry-delay 2 -o "$$MODEL_FILE" "$$MODEL_URL";
        else
          echo "Model already exists (non-empty)";
        fi;
        echo "Final file:";
        ls -lh "$$MODEL_FILE"
      '
    restart: "no"


  model-init:
    image: ollama/ollama:latest
    env_file: ./.env
    environment:
      OLLAMA_HOST: http://model:11434
      MODEL_FILE: ${MODEL_FILE:-/models/softball.Q4_K_M.gguf}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-softball-q4}
    depends_on:
      model:
        condition: service_healthy
      model-fetch:
        condition: service_completed_successfully
    volumes:
      - ollama:/root/.ollama
      - ./models:/models
      - ./scripts:/scripts
    entrypoint: ["/bin/sh","-c"]
    command: /scripts/model_init.sh
    restart: "no"


  api:
    build: ./backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      LLM_RATE_MAX: ${LLM_RATE_MAX}
      LLM_RATE_WINDOW_SEC: ${LLM_RATE_WINDOW_SEC}
      MAX_LIMIT: ${MAX_LIMIT}
      DEFAULT_LIMIT: ${DEFAULT_LIMIT}
    depends_on:
      db:
        condition: service_healthy
      model:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20
    working_dir: /app
    env_file:
      - ./.env
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - api

volumes:
  db_data:
  ollama: